<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moshi 功能審核</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6b66;
    --line: #e2e2dd;
    --accent: #1f7a4d;
    --warn: #9a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515;
      --card: #1f1f1f;
      --text: #ececea;
      --muted: #a3a39e;
      --line: #333331;
      --accent: #5fd39a;
      --warn: #f0b35a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, "PingFang TC", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 0 0 18px; }
  .card h2 { font-size: 19px; margin: 0 0 4px; }
  .tag { display: inline-block; font-size: 13px; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 0 8px; margin-left: 6px; }
  dl { margin: 12px 0; }
  dt { font-weight: 600; margin-top: 8px; }
  dd { margin: 2px 0 0; }
  .media { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .media video, .media img { width: 180px; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #000; }
  .q { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  .q p { margin: 8px 0 4px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opts label { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .opts input { margin-right: 4px; }
  details { margin-top: 10px; color: var(--muted); }
  summary { cursor: pointer; }
  .bar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  button { font: inherit; background: var(--accent); color: var(--bg); border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
  #status { color: var(--muted); font-size: 14px; }
  textarea { width: 100%; height: 160px; margin-top: 8px; font: 13px/1.4 ui-monospace, monospace; display: none; }
</style>
</head>
<body>
<main>
  <h1>Moshi 功能審核</h1>
  <p class="lead">每張卡先看「你現在怎麼做」和「Moshi 省了哪一步」，再回答三題。標「需要本人驗證」的，是鏡像操作測不到、要你自己在手機上試的。答完按最下面的按鈕，把答案貼回給我。詳細證據在 features.md 與 run-log.md。</p>
  <div id="cards"></div>
  <div class="bar">
    <button id="copy">複製我的答案</button>
    <span id="status"></span>
  </div>
  <textarea id="out" readonly></textarea>
</main>
<script>
const cards = [
  { id: "1-1", title: "批准 agent 的工具權限", when: "離開電腦，agent 卡在「要不要寫這個檔／跑這個指令」。", now: "開 Collie、進那個 pane，Collie 從畫面辨認權限提示讓你點。", saves: "收件匣是跨所有 agent 的待辦清單；點卡片就有「拒絕／允許」大按鈕；在對話畫面裡也會浮出核准條。Edit 類卡片沒有 diff 預覽。", clips: ["s1-inbox-card", "s1-approve", "s1-reject"], shots: ["s1-04", "s1-reject-02"], rec: "值得做：Collie 已能辨認提示，缺的是跨 agent 的入口和對話內核准條。難度中。" },
  { id: "1-2", title: "回覆 agent 的問題", when: "agent 列出選項等你回。", now: "Collie 的 composer 打字，或用 Quick replies。", saves: "看的是整理過的對話泡泡，工具呼叫摺成一列；卡片即時更新成最新訊息。", clips: ["s1-open-chat", "s1-chat-reply"], shots: [], rec: "Collie 已有 journal 對話頁，差距小。" },
  { id: "2-1", title: "看 agent 改了什麼（git 面板）", when: "agent 說改好了，你想在手機上確認。", now: "在 pane 畫面捲 Claude Code 印出的 diff，或回電腦。", saves: "工具列點開就有 inline diff；git 面板一頁看完整個 repo 的改動、歷史、分支、檔案樹。", clips: ["s2-tool-row", "s2-diff-view", "s2-git-tabs"], shots: ["s2-12", "s2-13"], rec: "值得做唯讀版（狀態＋diff＋歷史）。難度中。" },
  { id: "2-2", title: "在手機看 agent 起的網頁", when: "agent 改了前端、起了 dev server。", now: "回電腦開瀏覽器。", saves: "官方說內建瀏覽器經 SSH 轉送開本機伺服器。主機端確實偵測到我開的測試網頁，但手機入口我點不開。", clips: [], shots: [], rec: "可有可無：碰到 Collie 的單一前門與安全邊界。難度高。", self: true },
  { id: "2-3", title: "貼圖給 agent", when: "想給 agent 看截圖或錯誤畫面。", now: "Collie 上傳檔案，agent 收到的是檔案路徑。", saves: "agent 收到的是原生圖片附件；實測它讀出圖片裡的 42。代價是會覆蓋主機剪貼簿。", clips: ["s2-plus-menu", "s2-image-send"], shots: [], rec: "不建議照抄：Collie 的路徑法已夠用。" },
  { id: "3", title: "離開手機再回來", when: "切 app、鎖屏、換網路後回來繼續。", now: "重開 Collie PWA。", saves: "強制關閉再開會回到同一畫面並自動重連；動態島一直顯示 Live Activity。", clips: [], shots: ["home-01"], rec: "Live Activity 是原生 app 專屬，PWA 做不到。", self: true },
  { id: "U", title: "帳號用量", when: "想知道今天還能不能放心叫 agent 跑大任務。", now: "看 Mac 上的 statusline。", saves: "手機上直接看 Claude 5h／7d／Fable 與 Codex 用量、重置倒數、「偏快／偏慢」判讀，還能設額度恢復提醒。", clips: ["u-usage"], shots: ["u-01"], rec: "值得做：資料源在主機端，Collie bridge 可以同路取得。難度中。" },
  { id: "J", title: "跳至：跨工作區找 agent", when: "同時開很多 agent，要快速跳到某一個。", now: "Collie 的側邊欄與 session 切換器。", saves: "依工作區→分頁→session 標題分組，可搜尋、最近使用排序。", clips: ["kb-redo"], shots: ["kb-02"], rec: "小改：Collie 已有側邊欄，補搜尋與最近排序即可。" },
  { id: "G", title: "終端手勢與方向鍵搖桿", when: "在手機上操作 vim、less 這類畫面。", now: "Collie 的 Keys 抽屜。", saves: "雙擊送 Tab、三擊送 Esc、滑動切視窗；搖桿按住拖曳送方向鍵。鏡像操作完全測不到。", clips: [], shots: [], rec: "先親手試再說。", self: true },
  { id: "V", title: "語音輸入", when: "走路時想口述指令。", now: "Collie 已有語音轉文字（STT）。", saves: "iOS 26 裝置端辨識、本機 Whisper／Parakeet、雲端 BYOK。鏡像用不到麥克風。", clips: [], shots: [], rec: "Collie 已有同類能力，差在裝置端 Apple 引擎。", self: true },
  { id: "N", title: "通知、Live Activity、Apple Watch", when: "不打開手機也想知道 agent 做完沒、在手錶上直接批准。", now: "Collie 有 Web Push。", saves: "鎖定畫面與動態島顯示進度；手錶上允許。", clips: [], shots: [], rec: "原生 app 專屬，不適合 Collie。", self: true },
  { id: "R", title: "最近目錄一鍵開 shell", when: "想在手機上從某個專案目錄開新 agent。", now: "Collie 的 launchers.toml 要事先宣告。", saves: "主機掃 Claude／Codex 歷史列出最近目錄，一鍵開 shell 或 tmux。", clips: [], shots: [], rec: "可有可無：動態目錄要放寬 Collie 的 allowlist 原則。" }
];

const questions = [
  { key: "met", text: "你最近真的遇過這種情況嗎？", opts: ["常遇到", "偶爾", "沒遇過"] },
  { key: "enough", text: "現在的做法夠用嗎？", opts: ["夠用", "勉強", "不夠"] },
  { key: "switch", text: "下次遇到，你會想改用 Moshi 這種方式嗎？", opts: ["會", "不會", "想先親手試"] }
];

const storeKey = "moshi-review:v1";

const load = () => {
  try {
    return JSON.parse(localStorage.getItem(storeKey) ?? "{}");
  } catch {
    return {};
  }
};

const save = (state) => {
  try {
    localStorage.setItem(storeKey, JSON.stringify(state));
  } catch {
    return;
  }
};

const state = load();

const media = (card) => {
  const vids = card.clips.map((c) => `<video src="clips/${c}.mp4" controls muted playsinline preload="metadata"></video>`);
  const imgs = card.shots.map((s) => `<a href="screenshots/${s}.png" target="_blank"><img src="screenshots/${s}.png" alt="${card.title}" loading="lazy"></a>`);
  const all = [...vids, ...imgs];
  return all.length ? `<div class="media">${all.join("")}</div>` : "";
};

const questionBlock = (card) => questions.map((q) => {
  const name = `${card.id}-${q.key}`;
  const chosen = state[name];
  const opts = q.opts.map((o) => `<label><input type="radio" name="${name}" value="${o}" ${chosen === o ? "checked" : ""}>${o}</label>`).join("");
  return `<p>${q.text}</p><div class="opts">${opts}</div>`;
}).join("");

const render = () => {
  document.getElementById("cards").innerHTML = cards.map((card) => `
    <section class="card">
      <h2>${card.id}　${card.title}${card.self ? '<span class="tag">需要本人驗證</span>' : ""}</h2>
      <dl>
        <dt>你會在什麼時候用</dt><dd>${card.when}</dd>
        <dt>你現在怎麼做</dt><dd>${card.now}</dd>
        <dt>Moshi 省了哪一步</dt><dd>${card.saves}</dd>
      </dl>
      ${media(card)}
      <div class="q">${questionBlock(card)}</div>
      <details><summary>我的建議（看完再展開）</summary><p>${card.rec}</p></details>
    </section>`).join("");
};

render();

document.getElementById("cards").addEventListener("change", (e) => {
  if (e.target.type !== "radio") return;
  state[e.target.name] = e.target.value;
  save(state);
});

document.getElementById("copy").addEventListener("click", async () => {
  const lines = cards.map((card) => {
    const answers = questions.map((q) => `${q.text.replace(/？$/, "")}：${state[`${card.id}-${q.key}`] ?? "未答"}`);
    return `${card.id} ${card.title}｜${answers.join("｜")}`;
  });
  const text = lines.join("\n");
  const out = document.getElementById("out");
  out.value = text;
  try {
    await navigator.clipboard.writeText(text);
    document.getElementById("status").textContent = "已複製，貼回給 Claude 即可。";
  } catch {
    out.style.display = "block";
    out.select();
    document.getElementById("status").textContent = "無法自動複製，請手動複製下方文字。";
  }
});
</script>
</body>
</html>
